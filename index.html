<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عذرخواهی از بهار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --p1:#2b0a4e;
    --p2:#5b1a8a;
    --p3:#8b2fc9;
    --p4:#c084fc;
    --p5:#f0abfc;
    --glow:#e9d5ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:'Vazirmatn','Tahoma',sans-serif;
    background:radial-gradient(ellipse at center, var(--p2) 0%, var(--p1) 60%, #0d0221 100%);
  }
  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg{ display:block; }
  .icon{ width:1em; height:1em; display:inline-block; vertical-align:-0.15em; }

  /* ===== Stars background ===== */
  #stars{ position:absolute; top:0; left:0; width:100%; height:100%; }
  .star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle{
    0%,100%{opacity:.2; transform:scale(.8);}
    50%{opacity:1; transform:scale(1.3);}
  }

  /* ===== Floating orbs ===== */
  .orb{ position:absolute; border-radius:50%; filter:blur(50px); opacity:.45; animation:float 12s infinite ease-in-out; }
  .orb1{width:280px;height:280px;background:var(--p3);top:8%;left:10%;animation-duration:14s;}
  .orb2{width:220px;height:220px;background:var(--p4);bottom:10%;right:8%;animation-duration:10s;}
  .orb3{width:180px;height:180px;background:var(--p5);top:60%;left:75%;animation-duration:16s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-40px) scale(1.15);}
  }

  /* ===== Main card ===== */
  .container{
    position:relative;
    z-index:5;
    text-align:center;
    padding:36px 30px 40px;
    max-width:520px;
    width:92%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:28px;
    backdrop-filter:blur(18px);
    box-shadow:0 0 60px rgba(192,132,252,0.35), inset 0 0 40px rgba(255,255,255,0.05);
    animation:cardIn 1.2s ease-out;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(40px) scale(.9);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* ===== Real 3D draggable heart ===== */
  .heart-stage{
    width:220px;
    height:220px;
    margin:0 auto 6px;
    perspective:900px;
  }
  .heart-beat{
    width:100%; height:100%;
    transform-style:preserve-3d;
    animation:beat 1.35s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    22%{ transform:scale(1.08); }
    38%{ transform:scale(0.97); }
  }
  .heart-spin{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    cursor:grab;
    touch-action:none;
  }
  .heart-spin.grabbing{ cursor:grabbing; }
  .h-layer{
    position:absolute;
    width:180px; height:180px;
    left:20px; top:20px;
    background:linear-gradient(150deg, var(--p5), var(--p3) 55%, var(--p2));
    clip-path: path('M90 165 C 20 115, 5 70, 30 40 C 50 15, 85 20, 90 55 C 95 20, 130 15, 150 40 C 175 70, 160 115, 90 165 Z');
    backface-visibility:hidden;
  }
  .h-gloss{
    position:absolute;
    width:180px; height:180px;
    left:20px; top:20px;
    clip-path: path('M90 165 C 20 115, 5 70, 30 40 C 50 15, 85 20, 90 55 C 95 20, 130 15, 150 40 C 175 70, 160 115, 90 165 Z');
    background:radial-gradient(circle at 34% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0.15) 35%, transparent 60%);
    pointer-events:none;
  }

  /* floating mini hearts (svg) */
  .mini-heart{
    position:absolute;
    width:18px; height:18px;
    opacity:0;
    color:var(--p5);
    filter:drop-shadow(0 0 6px var(--p4));
    animation:rise 4s ease-in infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) scale(.6); opacity:0;}
    15%{opacity:1;}
    100%{ transform:translateY(-170px) translateX(var(--dx,20px)) scale(1.1); opacity:0;}
  }

  h1{
    margin-top:8px;
    color:#fff;
    font-size:clamp(20px,5vw,28px);
    font-weight:700;
    text-shadow:0 0 20px var(--p4);
    line-height:1.9;
  }
  h1 span{ color:var(--p5); font-weight:900; }
  p.sub{ margin-top:10px; color:#e9d5ffcc; font-size:15px; }
  p.hint{ margin-top:8px; color:#e9d5ff88; font-size:12.5px; }

  .buttons{
    margin-top:30px;
    display:flex;
    gap:18px;
    justify-content:center;
    align-items:center;
    position:relative;
    min-height:70px;
  }
  button{
    border:none;
    outline:none;
    cursor:pointer;
    font-family:inherit;
    font-size:16.5px;
    font-weight:700;
    padding:13px 26px;
    border-radius:50px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .15s ease, box-shadow .3s ease;
  }
  #yesBtn{
    background:linear-gradient(135deg,#f0abfc,#a855f7);
    color:#2b0a4e;
    box-shadow:0 0 25px rgba(240,171,252,0.6);
  }
  #yesBtn:hover{ transform:scale(1.08); box-shadow:0 0 40px rgba(240,171,252,0.9);}
  #noBtn{
    background:rgba(255,255,255,0.12);
    color:#fff;
    border:1px solid rgba(255,255,255,0.4);
    position:relative;
  }
  #noBtn.runaway{
    position:fixed;
    z-index:50;
    transition:top .35s cubic-bezier(.2,1.4,.4,1), left .35s cubic-bezier(.2,1.4,.4,1), transform .25s ease;
  }

  .result{
    margin-top:22px;
    font-size:16.5px;
    min-height:24px;
    color:var(--p5);
    font-weight:700;
    text-shadow:0 0 12px var(--p4);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .result.show{ animation:popIn .5s ease; }
  @keyframes popIn{
    0%{transform:scale(.7); opacity:0;}
    60%{transform:scale(1.08);}
    100%{transform:scale(1); opacity:1;}
  }

  /* confetti burst (svg) */
  .burst{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:100; overflow:hidden; }
  .burst .piece{
    position:absolute;
    top:-40px;
    color:var(--p5);
    filter:drop-shadow(0 0 6px var(--p4));
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:.2; }
  }

  @media (max-width:420px){
    .buttons{flex-direction:row; flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="stars"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">
  <div class="heart-stage" id="heartStage">
    <div class="heart-beat">
      <div class="heart-spin" id="heartSpin"></div>
    </div>
  </div>

  <h1>عذر می‌خوام عشقم <span>بهار</span><br>باهام آشتی کن؟</h1>
  <p class="sub">قربونت برم منتظر جوابتم</p>
  <p class="hint">(قلب رو با دستت بگیر و بچرخون)</p>

  <div class="buttons">
    <button id="yesBtn" onclick="makeUp()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.7 2.7 5.7-5.9"/></svg>
      آشتی
    </button>
    <button id="noBtn" onclick="dodge(this)" onmouseover="dodge(this)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span id="noText">قهر</span>
    </button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
  /* ---------- SVG helpers ---------- */
  const HEART_PATH = 'M12 21s-7.15-4.53-9.78-8.44C.5 9.4 1.28 5.4 4.6 3.9c2.4-1.08 5.02-.28 7.4 2.55 2.38-2.83 5-3.63 7.4-2.55 3.32 1.5 4.1 5.5 2.38 8.66C19.15 16.47 12 21 12 21z';
  const SPARKLE_PATH = 'M12 2l1.9 6.6L20.5 10l-6.6 1.9L12 18.5l-1.9-6.6L3.5 10l6.6-1.9L12 2z';

  function svgIcon(path, extra){
    return '<svg viewBox="0 0 24 24" fill="currentColor" ' + (extra||'') + '><path d="' + path + '"/></svg>';
  }

  /* ---------- Stars ---------- */
  const starsContainer = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.5+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = Math.random()*100+'%';
    s.style.left = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    starsContainer.appendChild(s);
  }

  /* ---------- Build the extruded 3D heart from stacked layers ---------- */
  const heartSpin = document.getElementById('heartSpin');
  const LAYER_COUNT = 30;
  const DEPTH = 50;
  for(let i=0;i<LAYER_COUNT;i++){
    const t = i/(LAYER_COUNT-1);
    const z = -DEPTH/2 + t*DEPTH;
    const brightness = 0.55 + t*0.7;
    const layer = document.createElement('div');
    layer.className = 'h-layer';
    layer.style.transform = 'translateZ(' + z.toFixed(2) + 'px)';
    layer.style.filter = 'brightness(' + brightness.toFixed(2) + ')';
    heartSpin.appendChild(layer);
  }
  // glossy highlight sits slightly in front of the front-most layer
  const gloss = document.createElement('div');
  gloss.className = 'h-gloss';
  gloss.style.transform = 'translateZ(' + (DEPTH/2 + 1) + 'px)';
  heartSpin.appendChild(gloss);
  // a soft mirrored back layer for when it's flipped around
  const backGloss = document.createElement('div');
  backGloss.className = 'h-gloss';
  backGloss.style.transform = 'translateZ(' + (-DEPTH/2 - 1) + 'px) scaleX(-1)';
  backGloss.style.opacity = '0.5';
  heartSpin.appendChild(backGloss);

  /* ---------- Drag-to-rotate + inertia + idle auto-spin ---------- */
  let rotX = -8, rotY = 20;
  let velX = 0, velY = 0;
  let dragging = false;
  let lastX = 0, lastY = 0;
  let idleTimer = null;
  let autoSpin = true;

  function applyTransform(){
    heartSpin.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
  }
  applyTransform();

  function frame(){
    if(dragging){
      // handled in pointermove
    } else if(Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02){
      rotY += velX;
      rotX -= velY;
      rotX = Math.max(-70, Math.min(70, rotX));
      velX *= 0.95;
      velY *= 0.95;
      applyTransform();
    } else if(autoSpin){
      rotY += 0.25;
      applyTransform();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function startIdleCountdown(){
    clearTimeout(idleTimer);
    autoSpin = false;
    idleTimer = setTimeout(()=>{ autoSpin = true; }, 2200);
  }

  function pointerDown(e){
    dragging = true;
    autoSpin = false;
    velX = 0; velY = 0;
    heartSpin.classList.add('grabbing');
    const p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('touchmove', pointerMove, {passive:false});
    window.addEventListener('mouseup', pointerUp);
    window.addEventListener('touchend', pointerUp);
  }
  function pointerMove(e){
    if(!dragging) return;
    e.preventDefault && e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - lastX;
    const dy = p.clientY - lastY;
    lastX = p.clientX; lastY = p.clientY;
    rotY += dx * 0.5;
    rotX -= dy * 0.5;
    rotX = Math.max(-70, Math.min(70, rotX));
    velX = dx * 0.5;
    velY = dy * 0.5;
    applyTransform();
  }
  function pointerUp(){
    dragging = false;
    heartSpin.classList.remove('grabbing');
    window.removeEventListener('mousemove', pointerMove);
    window.removeEventListener('touchmove', pointerMove);
    window.removeEventListener('mouseup', pointerUp);
    window.removeEventListener('touchend', pointerUp);
    startIdleCountdown();
  }
  heartSpin.addEventListener('mousedown', pointerDown);
  heartSpin.addEventListener('touchstart', pointerDown, {passive:true});

  /* ---------- Floating mini hearts around the 3D heart ---------- */
  const stage = document.getElementById('heartStage');
  function spawnMiniHeart(){
    const h = document.createElement('div');
    h.className = 'mini-heart';
    h.innerHTML = svgIcon(HEART_PATH);
    h.style.left = (30 + Math.random()*160)+'px';
    h.style.bottom = '10px';
    h.style.setProperty('--dx', (Math.random()*60-30)+'px');
    h.style.animationDuration = (3+Math.random()*2)+'s';
    stage.appendChild(h);
    setTimeout(()=>h.remove(), 5000);
  }
  setInterval(spawnMiniHeart, 550);

  /* ---------- Dodge logic for the "قهر" button ---------- */
  const noBtn = document.getElementById('noBtn');
  const noText = document.getElementById('noText');
  let noScale = 1;
  let dodgeCount = 0;
  const phrases = ['نه نه نه!','بگیرم نمی‌تونی','یه بار دیگه امتحان کن','آخه چرا قهری؟','نچ نچ نچ','دیگه کوچیک شدم ها','خب دیگه بسه!'];

  function dodge(el){
    dodgeCount++;
    noScale = Math.max(0.35, noScale - 0.09);

    if(!el.classList.contains('runaway')){
      const rect = el.getBoundingClientRect();
      el.style.width = rect.width+'px';
      el.classList.add('runaway');
      el.style.top = rect.top+'px';
      el.style.left = rect.left+'px';
    }

    const btnW = el.offsetWidth || 140;
    const btnH = el.offsetHeight || 50;
    const maxX = window.innerWidth - btnW - 20;
    const maxY = window.innerHeight - btnH - 20;
    const newX = Math.max(10, Math.random()*maxX);
    const newY = Math.max(10, Math.random()*maxY);

    el.style.top = newY+'px';
    el.style.left = newX+'px';
    el.style.transform = 'scale(' + noScale + ') rotate(' + (Math.random()*40-20) + 'deg)';

    noText.textContent = phrases[dodgeCount % phrases.length];

    if(noScale <= 0.36){
      el.style.opacity = '0.5';
      el.style.pointerEvents = 'none';
      setTimeout(()=>{
        el.style.transition = 'opacity .6s ease';
        el.style.opacity = '0';
      }, 300);
    }
  }

  /* ---------- Reconciliation ---------- */
  function makeUp(){
    const result = document.getElementById('result');
    result.classList.remove('show');
    void result.offsetWidth;
    result.innerHTML =
      '<span style="width:20px;height:20px;display:inline-flex;color:var(--p5)">' + svgIcon(HEART_PATH) + '</span>' +
      'ممنونم که با انتخاب قلبی خودت آشتی کردی، دوستت دارم بهار جونم' +
      '<span style="width:20px;height:20px;display:inline-flex;color:var(--p5)">' + svgIcon(HEART_PATH) + '</span>';
    result.classList.add('show');

    if(noBtn){ noBtn.style.opacity='0'; noBtn.style.pointerEvents='none'; }

    burstHearts();
  }

  function burstHearts(){
    const burst = document.createElement('div');
    burst.className = 'burst';
    document.body.appendChild(burst);
    const paths = [HEART_PATH, SPARKLE_PATH];
    for(let i=0;i<40;i++){
      const s = document.createElement('div');
      s.className = 'piece';
      const size = 14+Math.random()*20;
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.left = Math.random()*100+'%';
      s.style.animationDuration = (2.5+Math.random()*2.5)+'s';
      s.style.animationDelay = (Math.random()*0.6)+'s';
      s.innerHTML = svgIcon(paths[Math.floor(Math.random()*paths.length)]);
      burst.appendChild(s);
    }
    setTimeout(()=>burst.remove(), 5500);
  }
</script>

</body>
</html>
